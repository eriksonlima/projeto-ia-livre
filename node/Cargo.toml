[package]
name = "ia-livre-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Nó Rede IA Livre v1 (camada 4) — host, independente do SO"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
socket2 = { version = "0.5", features = ["all"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
mdns-sd = "0.22"
