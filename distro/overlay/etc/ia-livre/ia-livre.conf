# Configuração IA Livre Linux (scaffold — ADR 0027)
# Copiado para /etc/ia-livre/ia-livre.conf na imagem.

# Caminho do GGUF (qualquer modelo .gguf)
IA_LIVRE_MODEL=/var/lib/ia-livre/models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

# Tokens a gerar (runtime)
IA_LIVRE_N_PREDICT=32

# Camadas GPU (0 = CPU)
IA_LIVRE_N_GPU_LAYERS=0

# Memória do agente
IA_LIVRE_AGENT_MEMORY=/var/lib/ia-livre/agent-memory/memory.jsonl
